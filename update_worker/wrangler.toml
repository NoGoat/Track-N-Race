name = "track-n-race-updates"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Production: https://api.track-n-race.com (kUpdateServiceUrl in protocol_parser_library/src/Updates.cpp).
# Deploying creates the DNS record and certificate on the track-n-race.com zone.
workers_dev = false
routes = [{ pattern = "api.track-n-race.com", custom_domain = true }]

# The release files and signed manifests (publish-release.mjs uploads them).
# The bucket's own custom domain, downloads.track-n-race.com, serves the files;
# this Worker only reads the channel pointer and the manifest.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "track-n-race-releases"

[vars]
# Which channels/<CHANNEL>.json pointer this Worker offers.
CHANNEL = "stable"
# Versions to stop offering, comma-separated (e.g. "1.7.0,1.7.1").
BLOCKED_VERSIONS = ""

# Staging: npx wrangler deploy --env staging
# A separate Worker (track-n-race-updates-staging) on workers.dev only, no custom domain. It offers
# the staging channel from the same bucket, so a release can be tested end to end before it's promoted
# to stable. Apps reach it only with TNR_UPDATE_ENDPOINT set. Bindings and vars aren't inherited, so
# they're repeated here.
[env.staging]
workers_dev = true

[[env.staging.r2_buckets]]
binding = "RELEASES"
bucket_name = "track-n-race-releases"

[env.staging.vars]
CHANNEL = "staging"
BLOCKED_VERSIONS = ""
