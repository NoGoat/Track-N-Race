# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '33 4 * * 2'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ESLint tooling lives in .github/eslint rather than electron-frontend's
      # package.json: typescript-eslint doesn't support the TypeScript 7 that
      # electron-frontend uses, so the linter gets its own TypeScript.
      - name: Install ESLint
        working-directory: .github/eslint
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        working-directory: electron-frontend
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: ../.github/eslint/node_modules/.bin/eslint .
          --config ../.github/eslint/eslint.config.mjs
          --format ../.github/eslint/node_modules/@microsoft/eslint-formatter-sarif/sarif.js
          --output-file ../eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
