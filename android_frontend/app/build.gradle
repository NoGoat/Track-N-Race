plugins {
    id "com.android.application"
}

android {
    namespace "com.tracknrace.android"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.tracknrace.android"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared", "-DTNRP_USE_QT=OFF"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(":capacitor-android")
    // TelemetryPlugin uses WebMessageCompat directly for the binary hot path.
    // Match the version pinned by Capacitor 8.5.1.
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}
