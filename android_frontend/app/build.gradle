plugins {
    // AGP 9 compiles Kotlin itself; org.jetbrains.kotlin.android is no longer
    // applied (see the top-level build file for the pinned Kotlin version).
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

// The release key is never committed. Its location and alias come from
// android_frontend/keystore.properties (gitignored; see
// keystore.properties.example) or, when that file is absent, from
// TNR_KEYSTORE_FILE and TNR_KEY_ALIAS. The passwords are never stored in a
// file: build-signed-apk prompts for them and passes them in
// TNR_KEYSTORE_PASSWORD and TNR_KEY_PASSWORD.
def releaseSigning = [
    storeFile    : System.getenv("TNR_KEYSTORE_FILE"),
    keyAlias     : System.getenv("TNR_KEY_ALIAS"),
    storePassword: System.getenv("TNR_KEYSTORE_PASSWORD"),
    keyPassword  : System.getenv("TNR_KEY_PASSWORD"),
]
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    releaseSigning.storeFile = keystoreProperties.getProperty("storeFile")
    releaseSigning.keyAlias = keystoreProperties.getProperty("keyAlias")
}
def hasReleaseSigning = releaseSigning.values().every { it }

// build-signed-apk passes the release version; local builds keep the defaults.
def tnrVersionName = project.findProperty("tnrVersionName") ?: "0.1.0"
def tnrVersionCode = (project.findProperty("tnrVersionCode") ?: "1") as int

// Self-update. The certificate an update APK must carry for "Update now":
// the release key's (build-signed-apk prints it). Other builds can't install
// a release APK, so they only offer the download page.
def releaseCertSha256 = "719df24ee6898efb22600e80a5efd269ef032795bbe6253e4ee43ec1cca8396a"
// Update end-to-end test builds only: -PtnrUpdateTestEndpoint=http://127.0.0.1:8790
// points the update check at a local Worker, skips the daily limit, and trusts
// the debug key, which signs both test APKs. It requires -PtnrLocalReleaseSigning
// so a test build can never carry the release signature and install over a
// real user's copy. build-signed-apk never passes it; the field stays empty and
// R8 drops the test path from release APKs.
def updateTestEndpoint = (project.findProperty("tnrUpdateTestEndpoint") ?: "").toString().replaceAll('/+$', "")
def updateCertSha256 = releaseCertSha256
if (!updateTestEndpoint.isEmpty()) {
    if (!project.hasProperty("tnrLocalReleaseSigning")) {
        throw new GradleException("tnrUpdateTestEndpoint needs -PtnrLocalReleaseSigning: update test builds must be debug-signed.")
    }
    def debugKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
    def keystore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
    debugKeystore.withInputStream { keystore.load(it, "android".toCharArray()) }
    def digest = java.security.MessageDigest.getInstance("SHA-256")
        .digest(keystore.getCertificate("androiddebugkey").encoded)
    updateCertSha256 = digest.collect { String.format("%02x", it & 0xff) }.join()
}

// AGP 9's DSL: properties are assigned, and collection options are added to
// rather than called as methods.
android {
    namespace = "com.nogoat.tracknrace"
    compileSdk = 37
    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId = "com.nogoat.tracknrace"
        minSdk = 26
        // API 37 blocks local network traffic until the user grants
        // ACCESS_LOCAL_NETWORK; TelemetryController gates every LAN use on it.
        targetSdk = 37
        versionCode = tnrVersionCode
        versionName = tnrVersionName
        buildConfigField("String", "UPDATE_CERT_SHA256", "\"$updateCertSha256\"")
        buildConfigField("String", "UPDATE_TEST_ENDPOINT", "\"$updateTestEndpoint\"")

        externalNativeBuild {
            cmake {
                cppFlags.add("-std=c++20")
                arguments.addAll("-DANDROID_STL=c++_shared", "-DTNRP_USE_QT=OFF")
            }
        }

        ndk {
            abiFilters.add("arm64-v8a")
            // x86_64 lets the APK run natively on an x86_64 emulator image.
            // Opt-in so phone builds don't compile the native code twice;
            // build-and-run passes it when an x86_64 device is targeted.
            if (project.hasProperty("tnrX86")) {
                abiFilters.add("x86_64")
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = rootProject.file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            // Compose performance should be evaluated with R8 optimization;
            // a non-debuggable build alone is not an optimized release.
            minifyEnabled = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            // Local release builds must be signed before adb can install them,
            // and use the debug key so they never need the release key.
            // Otherwise the release key signs the APK when it is configured,
            // and the APK stays unsigned when it is not.
            if (project.hasProperty("tnrLocalReleaseSigning")) {
                signingConfig = signingConfigs.debug
            } else if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.09.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "com.google.android.material:material:1.13.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    testImplementation "junit:junit:4.13.2"
}
