plugins {
    // AGP 9 compiles Kotlin itself; org.jetbrains.kotlin.android is no longer
    // applied (see the top-level build file for the pinned Kotlin version).
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

// The release key is never committed. Its location and alias come from
// android_frontend/keystore.properties (gitignored; see
// keystore.properties.example) or, when that file is absent, from
// TNR_KEYSTORE_FILE and TNR_KEY_ALIAS. The passwords are never stored in a
// file: build-signed-apk prompts for them and passes them in
// TNR_KEYSTORE_PASSWORD and TNR_KEY_PASSWORD.
def releaseSigning = [
    storeFile    : System.getenv("TNR_KEYSTORE_FILE"),
    keyAlias     : System.getenv("TNR_KEY_ALIAS"),
    storePassword: System.getenv("TNR_KEYSTORE_PASSWORD"),
    keyPassword  : System.getenv("TNR_KEY_PASSWORD"),
]
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    releaseSigning.storeFile = keystoreProperties.getProperty("storeFile")
    releaseSigning.keyAlias = keystoreProperties.getProperty("keyAlias")
}
def hasReleaseSigning = releaseSigning.values().every { it }

// build-signed-apk passes the release version; local builds keep the defaults.
def tnrVersionName = project.findProperty("tnrVersionName") ?: "0.1.0"
def tnrVersionCode = (project.findProperty("tnrVersionCode") ?: "1") as int

// AGP 9's DSL: properties are assigned, and collection options are added to
// rather than called as methods.
android {
    namespace = "com.nogoat.tracknrace"
    compileSdk = 37
    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId = "com.nogoat.tracknrace"
        minSdk = 26
        // API 37 blocks local network traffic until the user grants
        // ACCESS_LOCAL_NETWORK; TelemetryController gates every LAN use on it.
        targetSdk = 37
        versionCode = tnrVersionCode
        versionName = tnrVersionName

        externalNativeBuild {
            cmake {
                cppFlags.add("-std=c++20")
                arguments.addAll("-DANDROID_STL=c++_shared", "-DTNRP_USE_QT=OFF")
            }
        }

        ndk {
            abiFilters.add("arm64-v8a")
            // x86_64 lets the APK run natively on an x86_64 emulator image.
            // Opt-in so phone builds don't compile the native code twice;
            // build-and-run passes it when an x86_64 device is targeted.
            if (project.hasProperty("tnrX86")) {
                abiFilters.add("x86_64")
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = rootProject.file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            // Compose performance should be evaluated with R8 optimization;
            // a non-debuggable build alone is not an optimized release.
            minifyEnabled = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            // Local release builds must be signed before adb can install them,
            // and use the debug key so they never need the release key.
            // Otherwise the release key signs the APK when it is configured,
            // and the APK stays unsigned when it is not.
            if (project.hasProperty("tnrLocalReleaseSigning")) {
                signingConfig = signingConfigs.debug
            } else if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.09.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "com.google.android.material:material:1.13.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    testImplementation "junit:junit:4.13.2"
}
