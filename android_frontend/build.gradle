buildscript {
    dependencies {
        // AGP 9 compiles Kotlin itself and only guarantees its own minimum
        // Kotlin Gradle plugin. Pin KGP to the Compose compiler plugin's
        // version below; the two must match.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21"
    }
}

plugins {
    id "com.android.application" version "9.4.1" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.21" apply false
}
